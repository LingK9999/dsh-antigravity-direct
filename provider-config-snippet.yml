# Antigravity Provider 配置代码片段
# 位置：~/.dsh/profiles/<profile>/cordis.patch.yml 的 llm-pi-ai -> config -> providers 下
# 说明：v0.4.0 起支持在 DSH 设置面板「Antigravity 直连」中点击「⚡ 一键同步至 DSH 选择器」自动写入最新全部模型；
#      首次手动配置或自定义时，可直接参考或复制以下内容：

      antigravity:
        displayName: Antigravity直连
        apiKeyEnv: GEMINI_API_KEY
        api: openai-completions
        baseURL: http://127.0.0.1:8790/v1
        models:
          - id: gemini-3.8-flash-high
            name: Gemini 3.8 Flash (High)
            contextWindow: 1048576
            maxTokens: 65536
            input:
              - text
              - image
            reasoningEfforts:
              low: low
              medium: medium
              high: high
            compat:
              supportsDeveloperRole: false
              supportsReasoningEffort: true
              thinkingFormat: openai
              thinkingTokenBudgetField: thinking_token_budget
          - id: gemini-3.8-flash-medium
            name: Gemini 3.8 Flash (Medium)
